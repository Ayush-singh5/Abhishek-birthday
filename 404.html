<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0a0f" />
  <title>For Ananya — A Little Something</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, rgba(217,181,122,.12), transparent 34%), #0c0a0f;
      color: #f4efe8;
      font-family: Inter, system-ui, sans-serif;
      text-align: center;
      padding: 28px;
    }
    .wrap { max-width: 620px; }
    .eyebrow { letter-spacing: .18em; font-size: .72rem; text-transform: uppercase; opacity: .65; }
    h1 { font-family: Georgia, serif; font-weight: 500; font-size: clamp(2.5rem, 8vw, 5rem); margin: 18px 0 12px; }
    p { line-height: 1.7; opacity: .72; }
    a { display: inline-block; margin-top: 18px; color: #f0d7a7; text-decoration: none; border-bottom: 1px solid rgba(240,215,167,.4); padding-bottom: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">One small detour</div>
    <h1>Let's go back.</h1>
    <p>The celebration page is waiting for you.</p>
    <a href="./">Return to the beginning →</a>
  </div>
</body>
</html>
